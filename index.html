Se erro re-modela imediatamente e retorna ao passo 1Se 3 acertos consecutivos reduzir pista gestual/visualCritério de subida: 3 acertos consecutivos no mesmo item sem pista.4 — Nomeação visual das mesmas palavras-alvo (15 min)Formato: mostrar imagem / ele diz (tentativa livre) / se falha vai para modo repetição imediata do mesmo itemOrdem funcional sugerida (cotidiano):MAMÃE — BEBÊ — BOMBO (bomba de ar) — CABO — BOCA — CAMA — SABÃO(Não precisa ser exatamente as mesmas CVC puras, entrar com CV-CV-C está OK na integração, mas corrigindo apenas alvos bilabiais do dia)Regra de ouro nesta etapa:Se erro no espontâneoModelo imediatoRepetição simultâneaRepetição atrasadaSe persistente deixa pontuação de acerto com pista e segue5 — Encerramento com alto acerto (5 min)Voltar a 2–3 palavras com 100% de acerto no bloco anterior e registrar sucesso“Terminamos com palavras que você falou MUITO bem: ____ , ____ , ____.”Emoção de competência = retenção + aderênciaSCRIPT de ERRO (como você escolheu)Nunca dizer “não”, “errado”apenas re-modelar:“Olha assim: BEM…” (paciente copia)“De novo… (espera 1 tempo)”Se acerta valida (“isso!”)Se erra de novo volta um passo na hierarquia (simultâneo)CRITÉRIO de PROGRESSÃO DENTRO DA SESSÃOSe 3 acertos consecutivos sem pista subir (tirar apoio visual/ritmo/espelho)Se 2 erros seguidos descer 1 nível (voltar para simultâneo ou sílaba)","dados":{},"criadoEm":"2025-11-04T09:39:39","atualizadoEm":"2025-11-04T09:39:39"},{"id":"mv6uoasjbmngndlqd","atendimentoId":"","pacienteId":"opjlpz03tmngndlps","profissionalId":"7x5lyc4rmmngndlpt","tipo":"conduta","titulo":"Evolução","conteudo":"[CONDUTA]\nIniciará RDT na próxima semana. Drenagem cervical, aplicação de bandagem, relaxamento cervical e mobilidade de língua remanescente. Mantendo VO exclusiva e ganho de peso. Retorno 1x na semana até iniciar a RDT, depois 2x para laser.","dados":{},"criadoEm":"2025-11-07T08:51:01","atualizadoEm":"2025-11-07T08:51:01"},{"id":"1hddbjm67mngndlqd","atendimentoId":"","paciente
